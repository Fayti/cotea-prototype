<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Côtéa — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#152238; --ink2:#1E3A5F;
  --coral:#F0604D; --coral-d:#D8492F;
  --purple:#6C4FE0; --purple-d:#5638C4;
  --sidebar:#0F1830;
  --paper:#FFFFFF; --cream:#F5F6FA;
  --line:rgba(21,34,56,.10); --muted:rgba(21,34,56,.55);
  --shadow:0 10px 28px rgba(16,26,48,.10); --shadow-lg:0 24px 60px rgba(10,16,30,.35);
  --r:18px; --r-lg:24px; --r-sm:12px;
  --blue-bg:#E4EEFC; --blue:#2D6FE0;
  --teal-bg:#DEF3F1; --teal:#128A82;
  --coral-bg:#FCE7E2;
  --purple-bg:#EAE4FB;
  --amber-bg:#FCF0D9; --amber:#B9791E; --amber-solid:#E8A93B;
  --pink-bg:#FCE4EC; --pink:#D34D82;
  --green-bg:#E1F3EA; --green:#1F8F5A; --green-solid:#2FA36B;
  --navy-bg:#E4E8F2; --orange-bg:#FDEADB; --orange:#C1631B;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--sidebar);min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:4px}
img{max-width:100%;display:block}
svg{stroke:currentColor;overflow:visible;width:20px;height:20px;flex:none}
.icon-circle,.iconbtn,.cat-card svg.chev,.tab,.acard .fav,.acard .ctarow .ic,.subcat,.interest,.step-row .icon-circle,.explainer-card .play,.watch-item .n,.snav button,.quick-item{color:var(--ink)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- demo bar ---------- */
.demo-bar{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:10px 16px;background:var(--sidebar);color:#fff;font-size:12px;letter-spacing:.02em}
.demo-bar .tag{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:16px}
.demo-bar .tag span{color:var(--coral)}
.demo-bar .sep{opacity:.3}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.seg button{padding:5px 14px;color:#fff;font-size:12px;font-weight:600}
.seg button.on{background:var(--coral);color:#fff}
.demo-bar .ghost{border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:5px 14px;color:#fff;font-size:12px}
.demo-bar .ghost:hover{border-color:var(--coral)}

/* ---------- stage / phone ---------- */
.stage{display:flex;justify-content:center;align-items:flex-start;padding:28px 12px 60px;min-height:calc(100vh - 42px)}
.phone{width:100%;max-width:412px;background:var(--cream);border-radius:38px;overflow:hidden;box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;height:min(880px,calc(100vh - 120px));min-height:640px;position:relative}
@media (max-width:480px){.stage{padding:0}.phone{max-width:none;border-radius:0;height:calc(100vh - 42px);height:calc(100dvh - 42px);min-height:0;box-shadow:none;border:none}}
.screen{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:block;position:relative}
#screen>*{animation:screenIn .2s ease}
@keyframes screenIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- typography ---------- */
.brand{font-family:'Baloo 2',sans-serif;font-weight:700}
h1,h2,h3,h4{font-family:'Baloo 2',sans-serif;font-weight:700;line-height:1.15;color:var(--ink)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.accent-line{width:46px;height:3px;background:var(--coral);border-radius:3px}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:99px;text-align:center;font-weight:700;font-size:14.5px;transition:transform .1s ease,opacity .15s}
.btn:active{transform:scale(.98)}
.btn-coral{background:var(--coral);color:#fff;box-shadow:0 8px 20px rgba(240,96,77,.35)}
.btn-navy{background:var(--ink2);color:#fff}
.btn-purple{background:var(--purple);color:#fff}
.btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost{background:transparent;border:1.5px solid var(--coral);color:var(--coral)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-sm{padding:10px 14px;font-size:12.5px;width:auto}

/* ---------- cards / panels ---------- */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.pill-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.icon-circle{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.icon-circle svg{width:22px;height:22px}
.icon-circle.sm{width:34px;height:34px}
.icon-circle.sm svg{width:17px;height:17px}
.icon-circle.lg{width:56px;height:56px}
.icon-circle.lg svg{width:26px;height:26px}

/* ---------- fields ---------- */
.field{text-align:left;margin-top:14px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--ink)}
.field .cnt{font-weight:500;color:var(--muted);float:right}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-size:14px}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--coral)}

/* ---------- top bars ---------- */
.topbar{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;background:var(--cream);position:sticky;top:0;z-index:5}
.topbar .logo{font-size:20px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.iconbtn svg{width:19px;height:19px;stroke:var(--ink)}
.iconbtn .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--coral);border:2px solid var(--cream)}
.avatar{border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}

/* ---------- tabs (bottom nav) ---------- */
.tabs{position:absolute;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding:10px 6px calc(10px + env(safe-area-inset-bottom));z-index:6}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--muted);padding:4px 0;position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor}
.tab.on{color:var(--coral)}
.tab .bub{position:absolute;top:0;right:calc(50% - 20px);background:var(--coral);color:#fff;font-size:9px;font-weight:700;border-radius:99px;padding:1px 5px}
.fab{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px rgba(108,79,224,.45);z-index:7;border:4px solid var(--cream)}
.fab svg{width:24px;height:24px;stroke:#fff;stroke-width:2.4}

/* ---------- landing ---------- */
.landing{flex:1;display:flex;flex-direction:column;background:linear-gradient(180deg,#EAF2FB 0%,var(--cream) 220px)}
.landing .heroTop{padding:22px 20px 12px;text-align:center}
.landing .hero{position:relative}
.landing .hero img{width:100%;height:210px;object-fit:cover;display:block}
.landing .logo-big{font-size:34px}
.landing .tagline{font-size:13px;font-weight:700;color:var(--ink2);margin-top:6px}
.landing .subtag{font-size:11px;color:var(--muted);margin-top:2px}
.landing .body{padding:0 20px calc(26px + env(safe-area-inset-bottom));margin-top:-24px;position:relative;z-index:2}
.explainer-card{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:14px}
.explainer-card .play{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;flex:none}
.estab-card{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.estab-card .ic{width:46px;height:46px;border-radius:50%;background:var(--teal-bg);display:flex;align-items:center;justify-content:center;flex:none}
.feat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
.feat-row .feat{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.feat-row .feat .ic{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.feat-row .feat span{font-size:11px;font-weight:700}
.feat-row .feat small{font-size:10px;color:var(--muted);font-weight:500}
.landing .footline{text-align:center;padding:26px 20px 8px;font-size:13.5px;font-weight:700}
.landing .footline em{display:block;color:var(--coral);font-style:italic;margin-top:4px}

/* ---------- explainer overlay ---------- */
.expl-hero{display:flex;align-items:flex-start;gap:14px;padding:18px 20px}
.expl-hero img{width:120px;border-radius:14px;flex:none}
.step-row{display:flex;gap:14px;padding:16px 20px;position:relative}
.step-row .icon-circle{position:relative;z-index:1}
.step-row::before{content:"";position:absolute;left:38px;top:56px;bottom:-16px;width:2px;background:var(--line)}
.step-row:last-of-type::before{display:none}
.step-row h4{font-size:15.5px;margin-bottom:4px}
.step-row p{font-size:12.5px;color:var(--muted);line-height:1.5}
.notice-box{display:flex;align-items:center;gap:12px;background:var(--green-bg);border-radius:14px;padding:14px 16px;margin:8px 20px}

/* ---------- onboarding ---------- */
.onb{padding:22px 22px calc(22px + env(safe-area-inset-bottom));flex:1;display:flex;flex-direction:column}
.onb .top-progress{display:flex;gap:6px;margin-bottom:20px}
.onb .top-progress i{height:4px;flex:1;background:var(--line);border-radius:2px}
.onb .top-progress i.on{background:var(--purple)}
.onb .back-x{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.onb h2{font-size:23px;margin:8px 0 4px}
.onb .sub{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.5}
.onb .foot{margin-top:auto;padding-top:18px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:14px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--purple);width:18px;border-radius:4px}
.avatar-upload{width:84px;height:84px;border-radius:50%;background:#fff;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;margin:6px auto 4px;font-size:10.5px;font-weight:600;color:var(--muted)}
.avatar-upload svg{width:20px;height:20px;stroke:var(--muted)}
.choice-card{border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;text-align:left}
.choice-card.on{border-color:var(--purple);background:var(--purple-bg)}
.choice-card b{display:block;font-size:14px;margin-bottom:3px}
.choice-card p{font-size:12px;color:var(--muted);line-height:1.4}
.choice-card .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.choice-card.on .radio{border-color:var(--purple);background:var(--purple)}
.interest-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.interest-grid.two{grid-template-columns:1fr 1fr}
.interest{border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;font-weight:700;text-align:center;position:relative}
.interest svg{width:22px;height:22px}
.interest.on{border-color:var(--purple);background:var(--purple-bg)}
.interest .badge-ok{position:absolute;top:6px;right:6px;width:16px;height:16px;border-radius:50%;background:var(--purple);display:flex;align-items:center;justify-content:center}
.interest .badge-ok svg{width:10px;height:10px;stroke:#fff;stroke-width:3}
.check-row{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.check-row b{font-size:13.5px;display:block}
.check-row span{font-size:11.5px;color:var(--muted)}
.switch{width:44px;height:25px;border-radius:99px;background:#D8DCE6;position:relative;transition:background .15s;flex:none}
.switch.on{background:var(--green-solid)}
.switch i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on i{left:22px}
.privacy-check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:12.5px;line-height:1.5}
.privacy-check svg{width:16px;height:16px;stroke:var(--green-solid);flex:none;margin-top:2px}

/* ---------- home ---------- */
.home{padding:0 0 96px}
.home-hero{position:relative;padding:18px 20px 16px;overflow:hidden}
.home-hero img{position:absolute;top:0;right:0;height:100%;width:52%;object-fit:cover;opacity:.95;-webkit-mask-image:linear-gradient(90deg,transparent,#000 30%);mask-image:linear-gradient(90deg,transparent,#000 30%)}
.home-hero .txt{position:relative;z-index:1;max-width:62%}
.home-hero h2{font-size:23px;line-height:1.2}
.home-hero .script{color:var(--coral);font-style:italic}
.home-hero p{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 20px 6px}
.cat-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:flex-start;gap:10px;text-align:left;box-shadow:var(--shadow)}
.cat-card .txt{flex:1;min-width:0}
.cat-card b{font-size:13.5px;display:block;margin-bottom:3px;line-height:1.25}
.cat-card p{font-size:11px;color:var(--muted);line-height:1.4}
.cat-card svg.chev{width:15px;height:15px;stroke:var(--muted);flex:none;margin-top:4px}

/* ---------- category listing ---------- */
.cathead{position:relative;padding:16px 18px 0;background:var(--cream)}
.cathead .row1{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.cathead h2{font-size:21px;flex:1}
.subcat-row{display:flex;align-items:flex-start;gap:16px;overflow-x:auto;padding:14px 18px 4px;scrollbar-width:none}
.subcat-row::-webkit-scrollbar{display:none}
.subcat{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;font-size:10.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.tabseg{display:flex;border-bottom:1px solid var(--line);padding:6px 18px 0;gap:22px}
.tabseg button{padding:10px 2px;font-size:13.5px;font-weight:700;color:var(--muted);border-bottom:2.5px solid transparent}
.tabseg button.on.a{color:var(--ink);border-color:var(--ink)}
.tabseg button.on.b{color:var(--coral);border-color:var(--coral)}
.tabseg button.on.c{color:var(--purple);border-color:var(--purple)}
.catlist{padding:16px 18px 110px}
.info-banner{display:flex;align-items:center;gap:10px;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:12px;line-height:1.4}
.info-banner.g{background:var(--green-bg);color:#175A3C}
.info-banner.o{background:var(--coral-bg);color:#9B3B27}
.info-banner.p{background:var(--purple-bg);color:#4630A0}
.info-banner b{display:block;font-size:12.5px}
.live-dot{width:9px;height:9px;border-radius:50%;background:#E23A3A;flex:none;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}

/* ---------- activity cards ---------- */
.acard{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow);text-align:left;display:block;width:100%}
.acard .media{position:relative;height:118px}
.acard .media img{width:100%;height:100%;object-fit:cover}
.acard .media .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.35))}
.acard .tag{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;letter-spacing:.03em;padding:5px 10px;border-radius:99px;color:#fff}
.acard .fav{position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center}
.acard .fav svg{width:15px;height:15px;stroke:var(--ink)}
.acard .avstack{position:absolute;bottom:9px;left:10px;display:flex;align-items:center}
.acard .avstack .av{width:24px;height:24px;border-radius:50%;border:2px solid #fff;font-size:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;margin-right:-8px}
.acard .avstack .more{background:rgba(0,0,0,.55);color:#fff;font-size:9px;font-weight:700;border-radius:99px;padding:3px 8px;margin-left:4px}
.acard .body{padding:12px 14px 14px}
.acard h4{font-family:'Baloo 2',sans-serif;font-size:15px;font-weight:700;line-height:1.25;margin-bottom:6px}
.acard .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted);margin-bottom:8px}
.acard .meta span{display:inline-flex;align-items:center;gap:4px}
.acard .meta svg{width:12px;height:12px}
.acard .desc{font-size:11.5px;color:var(--muted);line-height:1.45;margin-bottom:9px}
.acard .row2{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted);margin-bottom:10px}
.acard .row2 b{color:var(--ink);font-weight:700}
.acard .orga{font-size:11px;color:var(--muted);margin-bottom:10px}
.acard .ctarow{display:flex;gap:8px;align-items:center}
.acard .ctarow .cta{flex:1;padding:11px;border-radius:99px;font-weight:700;font-size:12.5px;text-align:center}
.acard .ctarow .ic{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.acard .ctarow .ic svg{width:16px;height:16px;stroke:var(--ink)}
.acard.live .media{height:130px}
.acard.live h4{margin-bottom:4px}
.acard.past .body{display:flex;gap:10px}
.acard.past .stats{flex:1}
.acard.past .stats .row3{display:flex;gap:10px;font-size:11px;color:var(--muted);margin:4px 0 6px}
.acard.past .rating{font-size:11.5px;font-weight:700;color:var(--amber-solid)}
.acard.past .mini-map{width:70px;height:70px;border-radius:12px;flex:none;background:linear-gradient(135deg,#DCEBFB,#EAF4E3)}

/* ---------- filters ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 15px;font-size:12px;font-weight:700;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.count-row{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.count-row h3{font-size:16px}
.count-row .n{background:var(--purple-bg);color:var(--purple);font-weight:700;font-size:11px;padding:2px 8px;border-radius:99px;margin-left:6px}
.filter-btn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:99px;padding:8px 13px;background:#fff}
.filter-btn svg{width:14px;height:14px}

/* ---------- detail ---------- */
.detail{padding:0 0 110px}
.dethero{position:relative;height:260px}
.dethero img{width:100%;height:100%;object-fit:cover}
.dethero .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 32%,rgba(0,0,0,0) 60%,rgba(0,0,0,.55) 100%)}
.dethero .top-row{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between}
.dethero .top-row .r{display:flex;gap:8px}
.dethero .circ{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center}
.dethero .circ svg{width:17px;height:17px;stroke:var(--ink)}
.dethero .bottom{position:absolute;left:18px;right:18px;bottom:16px;color:#fff}
.dethero h2{color:#fff;font-size:24px;margin-bottom:8px}
.dethero .creator{display:flex;align-items:center;gap:8px}
.dethero .creator .av{width:26px;height:26px;border-radius:50%;font-size:10px}
.dethero .creator span{font-size:12.5px;font-weight:600}
.dethero .voybadge{margin-left:auto;background:var(--ink2);font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:99px;display:flex;align-items:center;gap:5px}
.dethero .voybadge svg{width:12px;height:12px;stroke:#fff}
.det-body{padding:16px 18px}
.statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.statgrid .st{display:flex;gap:8px;padding:6px 4px}
.statgrid .st svg{width:16px;height:16px;stroke:var(--coral);flex:none;margin-top:1px}
.statgrid .st b{display:block;font-size:12.5px;line-height:1.3}
.statgrid .st span{font-size:10.5px;color:var(--muted)}
.det-panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.det-panel h5{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;margin-bottom:12px}
.det-panel h5 svg{width:16px;height:16px;stroke:var(--ink)}
.det-panel .link{font-size:12px;font-weight:700;color:var(--coral);margin-left:auto}
.avrow{display:flex;align-items:center;gap:-6px}
.avrow-item{display:flex;flex-direction:column;align-items:center;gap:5px;margin-right:14px;font-size:11px;font-weight:600}
.avrow-item .av{width:44px;height:44px;border-radius:50%;font-size:14px}
.vis-toggle{border:1.5px solid var(--coral);background:var(--coral-bg);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.vis-toggle .top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.vis-toggle .top svg{width:16px;height:16px;stroke:var(--coral-d)}
.vis-toggle .top b{font-size:13px;flex:1}
.vis-toggle p{font-size:11.5px;color:#7A3826;line-height:1.5;margin:6px 0 10px}
.vis-toggle .modify{font-size:12px;font-weight:700;color:var(--coral-d);border:1.5px solid var(--coral);border-radius:99px;padding:6px 14px}
.tagpills{display:flex;flex-wrap:wrap;gap:8px}
.tagpill{display:flex;align-items:center;gap:6px;background:var(--cream);border-radius:99px;padding:8px 13px;font-size:12px;font-weight:600}
.tagpill svg{width:14px;height:14px}
.minimap{height:110px;border-radius:14px;background:linear-gradient(135deg,#DCEBFB,#EAF4E3);position:relative;margin-bottom:12px;overflow:hidden}
.minimap .pin{position:absolute;top:50%;left:50%;transform:translate(-50%,-100%)}
.minimap .pin svg{width:30px;height:30px;stroke:var(--coral);fill:var(--coral-bg)}
.addr b{display:block;font-size:13px}
.addr span{font-size:12px;color:var(--muted)}
.sticky-cta{position:sticky;bottom:0;background:linear-gradient(0deg,var(--cream) 60%,rgba(245,246,250,0));padding:16px 18px calc(8px + env(safe-area-inset-bottom));margin-top:-8px}

/* ---------- join confirmation ---------- */
.confirm{flex:1;display:flex;flex-direction:column}
.confirm .hero{position:relative;height:230px}
.confirm .hero img{width:100%;height:100%;object-fit:cover}
.confirm .hero .back{position:absolute;top:16px;left:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center}
.confirm .hero .back svg{width:17px;height:17px;stroke:var(--ink)}
.confirm .checkbadge{width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;margin:-32px auto 0;position:relative;z-index:2}
.confirm .checkbadge svg{width:32px;height:32px;stroke:var(--green-solid);stroke-width:2.4}
.confirm .body{padding:14px 22px calc(26px + env(safe-area-inset-bottom));text-align:center;flex:1}
.confirm h2{font-size:26px;margin-bottom:18px}
.confirm-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start}
.confirm-card .ic{width:44px;height:44px;border-radius:12px;flex:none;object-fit:cover}
.confirm-card h4{font-size:15px;margin-bottom:6px}
.confirm-card .meta{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.confirm-card .meta span{display:flex;align-items:center;gap:6px}
.confirm-card .meta svg{width:13px;height:13px;stroke:var(--coral)}
.part-banner{background:var(--cream);border-radius:16px;padding:14px 16px;text-align:left;margin-bottom:16px}
.part-banner .top{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.part-banner b{font-size:13.5px;display:block}
.part-banner span{font-size:11.5px;color:var(--muted)}
.confirm .avrow-item.me .av{border:2.5px solid var(--coral)}
.confirm .avrow-item.me span{color:var(--coral);font-weight:700}
.confirm .actions .btn{margin-bottom:10px}

/* ---------- create ---------- */
.create{padding:20px 20px calc(40px + env(safe-area-inset-bottom))}
.icon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 4px}
.icon-opt{border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;font-weight:700}
.icon-opt svg{width:22px;height:22px;stroke:var(--ink2)}
.icon-opt.on{border-color:var(--coral);background:var(--coral-bg)}
.icon-opt.on svg{stroke:var(--coral-d)}
.preview-wrap{padding-top:6px}

/* ---------- messages / chat ---------- */
.chatwrap{flex:1;display:flex;flex-direction:column}
.chatmsgs{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.45}
.msg .who{font-size:10.5px;font-weight:700;margin-bottom:3px;color:var(--coral)}
.msg.them{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px}
.msg.me{background:var(--ink2);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.msg .rep{display:block;margin-top:5px;font-size:10.5px;color:var(--muted);text-decoration:underline}
.chatbar{display:flex;gap:9px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
.chatbar input{flex:1;border:1px solid var(--line);border-radius:99px;padding:11px 16px;background:var(--cream);font-size:14px}
.chatbar button{width:42px;height:42px;border-radius:50%;background:var(--coral);color:#fff;flex:none;display:flex;align-items:center;justify-content:center}
.chatbar button svg{width:17px;height:17px;stroke:#fff}
.convo-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;text-align:left;width:100%}
.convo-item .thumb{width:48px;height:48px;border-radius:12px;object-fit:cover;flex:none}
.convo-item .txt{flex:1;min-width:0}
.convo-item b{font-size:13.5px;display:block}
.convo-item p{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- mes activités ---------- */
.myact-head{display:flex;align-items:center;gap:12px;padding:6px 0 18px}
.myact-head .av{width:48px;height:48px;border-radius:50%;font-size:17px}
.myact-sec{display:flex;align-items:center;margin-bottom:12px}
.myact-sec h3{font-size:16px;display:flex;align-items:center;gap:8px}
.myact-sec .n{background:var(--coral);color:#fff;font-size:10.5px;font-weight:700;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.myact-sec .link{margin-left:auto;font-size:12px;font-weight:700;color:var(--coral)}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.mini-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mini-card img{height:70px;width:100%;object-fit:cover}
.mini-card .b{padding:9px 10px}
.mini-card .badge{position:relative;top:-58px;left:8px;display:inline-block;font-size:9px;font-weight:800;color:#fff;padding:3px 8px;border-radius:99px}
.mini-card b{font-size:12px;display:block;margin-bottom:3px}
.mini-card .meta{font-size:10.5px;color:var(--muted)}
.row-card{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;text-align:left;width:100%}
.row-card img{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none}
.row-card .txt{flex:1;min-width:0}
.row-card b{font-size:13px;display:block;margin-bottom:2px}
.row-card .meta{font-size:11px;color:var(--muted)}

/* ---------- profil ---------- */
.prof{padding:20px 20px 100px}
.idcard{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.idcard .av{width:52px;height:52px;font-size:18px}
.setline{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.setline:last-child{border:none}
.link-danger{font-size:12.5px;color:var(--coral-d);font-weight:700}

/* ---------- tips ---------- */
.tip{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:12px}
.tip h4{font-size:15.5px;margin:5px 0 6px}
.tip p{font-size:12.5px;line-height:1.55;color:var(--ink)}
.tip .by{font-size:11px;color:var(--muted);margin-top:9px;display:flex;justify-content:space-between}

/* ---------- safety notice ---------- */
.safety{display:flex;gap:10px;align-items:flex-start;background:var(--green-bg);border-radius:14px;padding:12px 14px;margin:4px 0 14px;font-size:11px;line-height:1.5;color:#175A3C}
.safety svg{width:16px;height:16px;stroke:var(--green);flex:none;margin-top:1px}
.safety .more{color:var(--blue);font-weight:700;white-space:nowrap}

/* ---------- toast / modal ---------- */
#toasthost{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:250;width:min(380px,calc(100% - 32px))}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:13px 16px;font-size:13px;line-height:1.45;box-shadow:var(--shadow-lg);animation:up .25s ease;display:flex;gap:10px;align-items:flex-start}
.toast .ic{color:var(--coral);flex:none;margin-top:1px}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,35,.6);display:flex;align-items:center;justify-content:center;padding:22px;z-index:200}
.modal-card{background:#fff;border-radius:20px;max-width:380px;width:100%;padding:22px;box-shadow:var(--shadow-lg);max-height:86vh;overflow-y:auto;animation:up .2s ease}
.modal-card h3{font-size:19px;margin-bottom:4px}

/* ---------- dashboard (directeur) ---------- */
.dash-shell{width:100%;max-width:1320px;background:var(--cream);border-radius:22px;overflow:hidden;box-shadow:var(--shadow-lg);display:flex;min-height:760px;max-height:calc(100vh - 90px)}
.sidebar{width:236px;flex:none;background:var(--sidebar);color:#fff;display:flex;flex-direction:column;padding:20px 16px}
.sidebar .slogo{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:21px;padding:4px 8px 18px}
.sidebar .slogo span{color:var(--coral)}
.sidebar .scamp{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.06);border-radius:14px;padding:10px;margin-bottom:18px}
.sidebar .scamp img{width:38px;height:38px;border-radius:10px;object-fit:cover}
.sidebar .scamp b{font-size:12px;display:block}
.sidebar .scamp .stars{color:var(--amber-solid);font-size:10px}
.snav{display:flex;flex-direction:column;gap:2px;flex:1}
.snav button{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;font-size:13px;font-weight:600;color:rgba(255,255,255,.65);text-align:left}
.snav button svg{width:18px;height:18px;stroke:currentColor;flex:none}
.snav button.on{background:var(--purple);color:#fff}
.shelp{background:rgba(255,255,255,.06);border-radius:14px;padding:12px;font-size:11.5px;color:rgba(255,255,255,.75);margin-bottom:14px}
.shelp b{display:block;color:#fff;font-size:12px;margin-bottom:2px}
.suser{display:flex;align-items:center;gap:10px;padding-top:6px;border-top:1px solid rgba(255,255,255,.1)}
.suser .av{width:36px;height:36px;font-size:13px}
.suser b{font-size:12.5px;display:block}
.suser span{font-size:10.5px;color:rgba(255,255,255,.5)}
.dash-main{flex:1;overflow-y:auto;padding:26px 30px 40px;min-width:0}
.dash-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:22px}
.dash-top h1{font-size:24px}
.dash-top p{font-size:13px;color:var(--muted);margin-top:2px}
.dsel{display:flex;gap:10px}
.dsel button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.occ-banner{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--amber-bg);border:1px solid rgba(184,121,30,.25);border-radius:16px;padding:14px 18px;margin-bottom:20px;flex-wrap:wrap}
.occ-banner b{font-size:13px;display:block}
.occ-banner p{font-size:11.5px;color:#7A5A1E;margin-top:2px}
.occ-banner .in{display:flex;gap:8px;align-items:center}
.occ-banner input{width:80px;padding:9px 10px;border-radius:10px;border:1px solid var(--line)}
.sectitle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.03em;margin:0 0 12px;color:var(--ink2)}
.sectitle svg{width:16px;height:16px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.kpi2{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi2 .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.kpi2 b.num{font-family:'Baloo 2',sans-serif;font-size:26px;display:block}
.kpi2 .lbl{font-size:11.5px;font-weight:700;color:var(--ink)}
.kpi2 .sub{font-size:11px;color:var(--muted);margin-top:2px}
.spark{margin-top:8px;height:26px}
.dgrid3{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:16px;margin-bottom:20px}
.dgrid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:980px){.dgrid3,.dgrid2{grid-template-columns:1fr}}
.dpanel2{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.dpanel2 h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.stat-line{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.stat-line:last-child{border:none}
.stat-line b.num{font-family:'Baloo 2',sans-serif;font-size:22px;min-width:52px}
.stat-line .lbl{font-size:12.5px;font-weight:600}
.stat-line .sub{font-size:11px;color:var(--muted)}
.donut-wrap{display:flex;align-items:center;gap:18px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px}
.legend-item i{width:9px;height:9px;border-radius:50%;flex:none}
.leader{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12.5px}
.leader .rank{width:20px;font-weight:800;color:var(--muted)}
.leader .track{flex:1;height:8px;background:var(--cream);border-radius:5px;overflow:hidden}
.leader .track i{display:block;height:100%;background:var(--purple);border-radius:5px}
.leader .pct{width:38px;text-align:right;font-weight:700}
.hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12px}
.hbar-row .lbl{width:120px;flex:none;font-weight:600}
.hbar-row .track{flex:1;height:9px;background:var(--cream);border-radius:5px;overflow:hidden}
.hbar-row .track i{display:block;height:100%;border-radius:5px}
.hbar-row .val{width:36px;text-align:right;font-weight:700}
.partner-card{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.partner-card img{width:100%;height:64px;object-fit:cover;border-radius:10px;margin-bottom:8px}
.partner-card b{font-size:12.5px;display:block}
.partner-card .amt{font-family:'Baloo 2',sans-serif;font-size:18px;color:var(--purple);display:block;margin:4px 0 2px}
.partner-card .sub{font-size:10.5px;color:var(--muted)}
.impact-total{background:var(--purple-bg);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:8px}
.impact-total b{font-family:'Baloo 2',sans-serif;font-size:20px;color:var(--purple)}
.benefit-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.benefit-item{display:flex;gap:10px;align-items:flex-start}
.benefit-item b{font-size:13px;display:block}
.benefit-item span{font-size:11px;color:var(--muted)}
.dtable{width:100%;border-collapse:collapse;font-size:12.5px}
.dtable th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:0 10px 10px;font-weight:700}
.dtable td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
.dtable .actrow{display:flex;align-items:center;gap:10px}
.dtable .actrow img{width:38px;height:38px;border-radius:10px;object-fit:cover;flex:none}
.dtable .actrow b{font-size:12.5px;display:block}
.dtable .actrow span{font-size:10.5px;color:var(--muted)}
.status-pill{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.fillbar{width:90px;height:7px;background:var(--cream);border-radius:5px;overflow:hidden;display:inline-block;margin-right:8px;vertical-align:middle}
.fillbar i{display:block;height:100%;border-radius:5px}
.watch-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.watch-item:last-child{border:none}
.watch-item .n{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.quick-item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-radius:10px;font-size:12.5px;font-weight:600}
.mod-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.mod-row:last-child{border:none}
.mod-row.resolved{opacity:.5}
.mod-row .resolve{font-size:11px;font-weight:700;color:var(--green-solid);white-space:nowrap;flex:none}
.trend{display:flex;gap:14px;align-items:flex-end;padding:8px 2px 0;overflow-x:auto}
.trend .tbar{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;font-size:10.5px;color:var(--muted)}
.trend .tbar-col{height:74px;display:flex;align-items:flex-end}
.trend .tbar-col i{display:block;width:24px;border-radius:6px 6px 0 0}
.quick-item:hover{background:var(--cream)}
.quick-item svg{width:16px;height:16px;stroke:var(--purple)}
.linechart-wrap{position:relative}
.tooltip-bubble{position:absolute;background:var(--ink);color:#fff;font-size:11px;border-radius:10px;padding:8px 10px;transform:translate(-50%,-118%);white-space:nowrap;box-shadow:var(--shadow)}
.searchbar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 13px;flex:1;max-width:280px}
.searchbar svg{width:15px;height:15px;stroke:var(--muted)}
.searchbar input{border:none;background:none;flex:1;font-size:12.5px}
.dtabs{display:flex;gap:6px;margin-bottom:16px}
.dtabs button{padding:9px 14px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--muted)}
.dtabs button.on{background:var(--purple-bg);color:var(--purple)}
.qr-card2{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.qr-visual2{width:150px;height:150px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;flex:none}
.qr-visual2 svg{width:100%;height:100%}

function relTime(iso){
  const s=Math.floor((Date.now()-new Date(iso).getTime())/1000);
  if(s<60)return "à l'instant";
  if(s<3600)return `il y a ${Math.floor(s/60)} min`;
  if(s<86400)return "il y a "+Math.floor(s/3600)+"h";
  const d=Math.floor(s/86400);
  if(d===1)return "hier";
  return `il y a ${d} jours`;
}

async function boot(){
  $("screen").innerHTML=`<div class="landing" style="justify-content:center;align-items:center"><p class="small muted">Connexion à la communauté…</p></div>`;
  try{
    let {data:{session}}=await sb.auth.getSession();
    if(!session){
      const {data,error}=await sb.auth.signInAnonymously();
      if(error)return bootError("Connexion anonyme désactivée sur ce projet Supabase. Active-la dans Authentication > Sign In / Providers > Anonymous Sign-Ins.");
      session=data.session;
    }
    UID=session.user.id;
    const {data:prof}=await sb.from("profiles").select("*, establishments(*)").eq("id",UID).maybeSingle();
    if(prof&&prof.establishments){
      EST.id=prof.establishment_id;EST.name=prof.establishments.name;EST.place=prof.establishments.place;EST.joinCode=prof.establishments.join_code;
      S.user={name:prof.name,envies:prof.envies||[],visibility:prof.visibility};
      S.screen="home";S.tab="home";
      await loadEstablishmentData();
    }else{
      const p=new URLSearchParams(location.search);
      const urlCode=p.get("code");
      const code=(urlCode||DEFAULT_CODE).toUpperCase();
      const {data:est}=await sb.from("establishments").select("*").eq("join_code",code).maybeSingle();
      if(est){EST.id=est.id;EST.name=est.name;EST.place=est.place;EST.joinCode=est.join_code;S.prefillCode=urlCode?code:null;}
      else return bootError("Établissement introuvable pour ce code. Vérifiez le lien ou le QR utilisé.");
      S.screen="landing";
    }
    render();
  }catch(err){console.error(err);bootError("Une erreur réseau est survenue. Vérifiez votre connexion.");}
}

    return wrap(`

    `);
  }
  if(S.onbStep===2){
    return wrap(`
      <h2>Votre visibilité<br>par défaut</h2>

      </button>

      <div class="foot"><button class="btn btn-purple" onclick="S.onbStep=3;render()">Continuer</button><div class="dots">${Array.from({length:ONB_TOTAL},(_,i)=>`<i class="${i===1?"on":""}"></i>`).join("")}</div></div>
    `);
  }
  if(S.onbStep===3){

        ${opts.map(o=>`<button class="interest ${S.selEnvies.includes(o.id)?"on":""}" onclick="togEnvie('${o.id}')">${S.selEnvies.includes(o.id)?`<span class="badge-ok">${svg("check")}</span>`:""}${svg(o.icon)}${o.label}</button>`).join("")}

      ${roles.map(r=>`<button class="choice-card ${S.selRole===r.id?"on":""}" style="width:100%" onclick="S.selRole='${r.id}';render()"><div style="flex:1"><b>${r.label}</b><p>${r.p}</p></div><span class="radio">${S.selRole===r.id?svg("check"):""}</span></button>`).join("")}

      <div class="foot"><button class="btn btn-purple" onclick="S.onbStep=5;render()">Continuer</button><div class="dots">${Array.from({length:ONB_TOTAL},(_,i)=>`<i class="${i===3?"on":""}"></i>`).join("")}</div></div>
    `);
  }
  return wrap(`
    <div style="text-align:center;margin-bottom:6px"><span class="icon-circle lg" style="background:var(--purple-bg);margin:0 auto 10px">${svg("bell")}</span>
    <h2>Recevoir des suggestions<br>d'activités ?</h2>
    <p class="sub">Nous vous enverrons des idées d'activités adaptées à vos centres d'intérêt et à votre profil.</p></div>
    <button class="choice-card ${S.notifSuggest?"on":""}" style="width:100%" onclick="S.notifSuggest=true;render()"><div style="flex:1"><b>Oui, je souhaite recevoir des suggestions personnalisées</b><p>Recevez des idées d'activités qui pourraient vous plaire.</p></div><span class="radio">${S.notifSuggest?svg("check"):""}</span></button>

      ${["Elles servent uniquement à améliorer votre expérience pendant votre séjour.","Jamais revendues ni utilisées à des fins publicitaires.","Partagées uniquement sous forme de statistiques anonymisées avec l'établissement.","Modifiables ou supprimables à tout moment depuis votre profil."].map(t=>`<div class="privacy-check">${svg("check")}<span>${t}</span></div>`).join("")}
    </div>
    <div class="foot"><button class="btn btn-coral" onclick="finishOnboard()">Rejoindre la communauté 🎉</button><div class="dots">${Array.from({length:ONB_TOTAL},(_,i)=>`<i class="${i===4?"on":""}"></i>`).join("")}</div></div>
  `);
}

async function joinA(id){
  const a=findA(id);
  if(a.parts.length>=a.cap){toast("La dernière place vient d'être prise. Aucune surcapacité possible.");render();return;}
  const {error}=await sb.from("activity_participants").insert({activity_id:id,user_id:UID,user_name:S.user.name});
  if(error){toast("Impossible de rejoindre pour le moment. Réessayez.");console.error(error);return;}
  if(a.parts.length+1>=a.cap)await sb.from("activities").update({status:"complete"}).eq("id",id);
  await loadEstablishmentData();
  S.currentId=id;go("confirm");
}
async function leaveA(id){
  const a=findA(id);
  await sb.from("activity_participants").delete().eq("activity_id",id).eq("user_id",UID);
  if(a.status==="complete")await sb.from("activities").update({status:"ouverte"}).eq("id",id);
  await loadEstablishmentData();
  toast(`Vous avez quitté l'activité. ${esc(a.orga)} est notifié·e.`);
  render();
}
function cancelA(id){
  const a=findA(id);
  openModal(`
    <h3>Annuler l'activité</h3>
    <p class="small muted" style="margin:6px 0 14px">« ${esc(a.title)} » — les participants seront notifiés immédiatement.</p>
    <div class="field"><label>Motif <span class="muted">(optionnel)</span></label><textarea id="mcm" placeholder="Ex. météo, contretemps…"></textarea></div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-outline" onclick="closeModal()">Retour</button>
      <button class="btn btn-navy" onclick="confirmCancel('${id}')">Confirmer</button>
    </div>`);
}
async function confirmCancel(id){
  const a=findA(id);
  const motif=($("mcm").value||"").trim();
  const {error}=await sb.from("activities").update({status:"annulée"}).eq("id",id);
  closeModal();
  if(error){toast("Impossible d'annuler pour le moment.");console.error(error);return;}
  await loadEstablishmentData();
  const n=a.parts.filter(p=>p!==a.orga).length;
  toast(`Activité annulée${motif?" — motif transmis":""}. ${n>0?n+" participant"+(n>1?"s":"")+" "+(n>1?"sont":"est")+" notifié"+(n>1?"s":"")+".":"Aucun autre participant à notifier."}`);
  render();
}
async function report(what,ref){
  await sb.from("reports").insert({establishment_id:EST.id,what,ref:ref||null,by_user_id:UID});
  toast(`Signalement transmis à la modération (${what}). Il apparaît dans l'administration avec son contexte.`);
  loadEstablishmentData();
}
async function resolveReport(id){
  await sb.from("reports").update({resolved:true}).eq("id",id);
  await loadEstablishmentData();
  render();
}
function refLabel(what,ref){
  if(!ref)return "";
  if(what==="conseil"){const t=S.tips.find(x=>x.id===ref);return t?t.title:"";}
  const a=findA(ref);return a?a.title:"";
}

async function publishA(){

  const {data,error}=await sb.from("activities").insert({

    description:d.desc.trim()||null,date:d.date,time:d.time,lieu:d.lieu.trim(),

      </button>`;}).join("")

  </div>`;

let chatChannel=null;
async function openChat(id){
  const a=findA(id);
  if(!isIn(a)){toast("Le chat est réservé aux participants de l'activité.");return;}
  S.currentId=id;go("chat");
  const {data:msgs}=await sb.from("messages").select("*").eq("activity_id",id).order("created_at");
  S.chats[id]=(msgs||[]).map(mm=>({who:mm.user_name,text:mm.text}));
  render();
  if(chatChannel)sb.removeChannel(chatChannel);
  chatChannel=sb.channel("chat-"+id).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:`activity_id=eq.${id}`},payload=>{
    (S.chats[id]=S.chats[id]||[]).push({who:payload.new.user_name,text:payload.new.text});
    if(S.screen==="chat"&&S.currentId===id)render();
  }).subscribe();
}
function vChat(){
  const a=findA(S.currentId);

/* ---------- Dashboard : mini-graphiques SVG ---------- */
function sparkline(values,color){
  const w=140,h=26,max=Math.max(...values,1),min=Math.min(...values,0);
  const pts=values.map((v,i)=>`${(i/(values.length-1))*w},${h-((v-min)/(max-min||1))*h}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:26px"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function donut(segments,size,strokeW){
  size=size||120;strokeW=strokeW||16;
  const r=(size-strokeW)/2,c=size/2,circ=2*Math.PI*r;
  let offset=0;
  const total=segments.reduce((s,x)=>s+x.value,0)||1;
  const arcs=segments.map(seg=>{
    const frac=seg.value/total,len=frac*circ;
    const dash=`${len} ${circ-len}`;
    const el=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${strokeW}" stroke-dasharray="${dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${c} ${c})"/>`;
    offset+=len;return el;
  }).join("");
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;flex:none">${arcs}</svg>`;
}
function linechart(values,labels,w,h){
  w=w||560;h=h||140;
  const max=Math.max(...values),min=Math.min(...values,0);
  const pad=8;
  const pts=values.map((v,i)=>[pad+(i/(values.length-1))*(w-2*pad), h-pad-((v-min)/(max-min||1))*(h-2*pad)]);
  const line=pts.map(p=>p.join(",")).join(" ");
  const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--purple)"/>`).join("");
  return {svg:`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px"><polyline points="${line}" fill="none" stroke="var(--purple)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`,pts};
}

function reportsPanelDash(){
  const list=[...S.reports].sort((a,b)=>b.at-a.at);

  return list.map(r=>{

    const when=new Date(r.at).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
    return `<div class="mod-row ${r.resolved?"resolved":""}">
      <span><b style="text-transform:capitalize">${esc(r.what)}</b>${lbl?" · "+esc(lbl):""}<br><span class="muted">${when}</span></span>
      ${r.resolved?`<span class="muted">Résolu</span>`:`<button class="resolve" onclick="resolveReport('${r.id}')">Marquer résolu</button>`}
    </div>`;
  }).join("");
}
function exportCSV(){
  const list=S.activities;
  const head=["Titre","Catégorie","Type","Date","Heure","Lieu","Participants","Capacité","Statut","Organisateur"];
  const rows=list.map(a=>[a.title,catLabel(a.subcat)||catLabel(a.topcat),a.orga==="Équipe animation"?"Camping":"Voyageurs",a.date,a.time,a.lieu,a.parts.length,a.cap,a.status,a.orga]);
  const csv=[head,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const bom=String.fromCharCode(0xFEFF);
  const blob=new Blob([bom+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;link.download=`cotea-activites-${iso(daysFrom(0))}.csv`;
  document.body.appendChild(link);link.click();document.body.removeChild(link);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(`Export CSV téléchargé (${list.length} activités).`);
}
function vDashStatistiques(){
  const acts=S.activities;
  const byDate={};acts.forEach(a=>{byDate[a.date]=(byDate[a.date]||0)+1;});

  const avgRating=(PAST_EXPERIENCES.reduce((s,p)=>s+p.rating,0)/PAST_EXPERIENCES.length).toFixed(1);
  const pending=S.reports.filter(r=>!r.resolved).length;
  const resolved=S.reports.length-pending;
  const resolutionRate=S.reports.length?Math.round(resolved/S.reports.length*100):100;
  return dashHeader("Statistiques","Analysez la performance de votre communauté et gérez la modération.")+`
    <div class="kgrid">
      <div class="kpi2"><div class="top"><span class="icon-circle sm" style="background:var(--amber-bg);color:var(--amber)">${svg("star")}</span><div><b class="num">${avgRating} / 5</b><span class="lbl">Satisfaction moyenne</span></div></div></div>
      <div class="kpi2"><div class="top"><span class="icon-circle sm" style="background:var(--coral-bg);color:var(--coral-d)">${svg("info")}</span><div><b class="num">${S.reports.length}</b><span class="lbl">Signalements totaux</span></div></div></div>
      <div class="kpi2"><div class="top"><span class="icon-circle sm" style="background:var(--blue-bg);color:var(--blue)">${svg("clock")}</span><div><b class="num">${pending}</b><span class="lbl">En attente de modération</span></div></div></div>
      <div class="kpi2"><div class="top"><span class="icon-circle sm" style="background:var(--green-bg);color:var(--green)">${svg("check")}</span><div><b class="num">${resolutionRate}%</b><span class="lbl">Taux de résolution</span></div></div></div>
    </div>
    <div class="dgrid2">
      <div class="dpanel2">
        <div style="display:flex;align-items:center;margin-bottom:14px"><h3 style="margin:0">Activité par jour</h3><button class="btn btn-outline btn-sm" style="margin-left:auto" onclick="exportCSV()">${svg("download")} Exporter en CSV</button></div>
        ${dates.length?`<div class="trend">${dates.map(d=>`<div class="tbar" title="${fmtDate(d)} · ${byDate[d]} activité${byDate[d]>1?"s":""}"><div class="tbar-col"><i style="height:${Math.max(6,Math.round(byDate[d]/maxDay*70))}px;background:var(--purple)"></i></div><span>${new Date(d+"T00:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"})}</span></div>`).join("")}</div>`:`<p class="small muted">Aucune activité enregistrée.</p>`}
        <h3 style="margin-top:22px">Notes des expériences passées</h3>
        ${PAST_EXPERIENCES.map(p=>`<div class="hbar-row"><span class="lbl" style="width:170px">${esc(p.title)}</span><span class="track"><i style="width:${p.rating/5*100}%;background:var(--amber-solid)"></i></span><span class="val">${p.rating}/5</span></div>`).join("")}
      </div>
      <div class="dpanel2">
        <h3>Modération</h3>
        ${reportsPanelDash()}
      </div>
    </div>`;
}

boot();
</script>
</body>
</html>
