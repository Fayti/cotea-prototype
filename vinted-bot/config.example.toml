# Copier en config.toml puis adapter. config.toml est ignoré par git.

[general]
# Le bot envoie les requêtes au rythme maximal toléré, en tournant sur les recherches.
# Temps entre deux passages sur une recherche ≈ request_gap × nb de recherches / nb d'IP.
request_gap = 1.0       # plancher : secondes entre deux requêtes par IP. Ralentit seul si bloqué.
max_inflight = 3        # requêtes simultanées max par IP (Vinted lent ≠ bot lent)
per_page = 20           # annonces demandées par requête (petit = réponse plus rapide)
warmup_per_page = 96    # au premier lancement : annonces de référence pour la médiane
max_age_minutes = 60    # ignore les annonces plus vieilles (redémarrage après une longue pause)
db_path = "vinted_bot.sqlite3"
impersonate = "chrome"  # empreinte navigateur imitée par curl_cffi
console = true
stats_every = 60        # résumé périodique dans les logs (débit, blocages, délais) ; 0 = off
# Chaque proxy est une IP de plus : le débit total est multiplié d'autant.
# proxies = ["http://user:pass@host:port"]
use_direct = true       # utiliser aussi la connexion directe en plus des proxies

[deals]
window = 200       # nombre de prix récents utilisés pour la médiane de chaque recherche
min_samples = 15   # en dessous, pas de calcul de bonne affaire
threshold = 0.30   # « bonne affaire » = au moins 30 % sous la médiane

[telegram]
# Ou variables d'environnement TELEGRAM_TOKEN / TELEGRAM_CHAT_ID
token = ""
chat_id = ""

[discord]
# Ou variable d'environnement DISCORD_WEBHOOK
webhook_url = ""

# Une section [[search]] par recherche. Le plus simple : faire la recherche sur
# vinted.fr avec tous les filtres voulus, puis coller l'URL de la page dans `url`.

[[search]]
name = "Air Max 90 — 42"
url = "https://www.vinted.fr/catalog?search_text=air%20max%2090&brand_ids[]=53&price_to=60"
exclude = ["lot", "enfant", "copie", "réplique", "abîmé"]   # mots interdits dans le titre
max_price = 60
weight = 2   # recherche prioritaire

[[search]]
name = "PS5 Pro"
url = "https://www.vinted.fr/catalog?search_text=ps5%20pro&price_from=200"
include_any = ["pro"]
exclude_desc = ["boîte vide"]   # mots interdits dans la description (lue sur la page)
min_reviews = 1   # écarte les vendeurs sans aucune évaluation
# anti_scam = true (par défaut) : WhatsApp, numéro, PayPal, « ne pas commander avant message »,
# consoles en panne… sont écartés, même déguisés (« W.h.a.t.s.a.p.p », « p@ypal »).

[[search]]
name = "Carhartt Detroit — bonnes affaires seulement"
search_text = "carhartt detroit jacket"
include_any = ["detroit"]   # au moins un de ces mots dans le titre
only_deals = true           # n'alerte que si le prix est sous la médiane de la recherche
anti_scam = false           # pas de lecture de page pour cette recherche
weight = 1                  # 2 = interrogée deux fois plus souvent que les autres
