name: VintedBot

on:
  push:
    branches: [claude/busy-archimedes-xdeifv, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vinted-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vinted-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - name: Test de bout en bout contre le vrai Vinted (informatif)
        continue-on-error: true
        run: python scripts/probe_vinted.py 90

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: VintedBot.exe
            built: dist/VintedBot.exe
            sep: ";"
          - os: macos-latest
            asset: VintedBot-mac-arm64
            built: dist/VintedBot
            sep: ":"
          - os: macos-15-intel
            asset: VintedBot-mac-x86_64
            built: dist/VintedBot
            sep: ":"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: vinted-bot
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Construire l'exécutable
        run: >
          pyinstaller --noconfirm --onefile --name VintedBot --console
          --collect-all curl_cffi --collect-all webview --collect-all pillow_heif
          --add-data "vinted_bot/web${{ matrix.sep }}vinted_bot/web" launcher.py
      - name: Autotest de l'exécutable
        run: ./${{ matrix.built }} selftest
      - name: Fenêtre Vinted (ouvre une vraie fenêtre et y exécute du JavaScript)
        run: >
          python -c "import subprocess,sys; r=subprocess.run(['./${{ matrix.built }}','window-probe'],
          capture_output=True,text=True,timeout=120); print(r.stdout[-3000:], r.stderr[-3000:]);
          sys.exit(0 if 'WINDOW OK 2' in r.stdout else 1)"
      - name: Test de bout en bout (informatif)
        continue-on-error: true
        run: python scripts/probe_vinted.py 60
      - run: mkdir -p out && cp ${{ matrix.built }} out/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: vinted-bot/out/${{ matrix.asset }}

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publier en téléchargement direct
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp vinted-bot/install-mac.sh release-files/
          ls -la release-files
          gh release delete vinted-bot-latest --cleanup-tag --yes || true
          gh release create vinted-bot-latest release-files/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "VintedBot (Windows et Mac)" \
            --notes "Windows : télécharge VintedBot.exe puis double-clique dessus.
          Mac : ouvre le Terminal et colle
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/vinted-bot-latest/install-mac.sh | bash
          Construit depuis ${GITHUB_SHA::7}."

  mac-install:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Installation exactement comme l'utilisateur, puis autotest
        run: |
          mkdir -p "$HOME/Desktop"
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/vinted-bot-latest/install-mac.sh" \
            | VINTEDBOT_NO_LAUNCH=1 bash
          test -d "$HOME/Desktop/VintedBot.app"
          "$HOME/VintedBot/VintedBot" selftest
      - name: Interrupteur (allumer, vérifier que l'interface répond, éteindre)
        run: |
          SW="$HOME/VintedBot/vintedbot-switch.sh"
          test "$(bash "$SW" status)" = off
          bash "$SW" on
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8765/api/whoami | grep -q VintedBot && break; sleep 1; done
          curl -fs http://127.0.0.1:8765/api/whoami | grep -q VintedBot
          test "$(bash "$SW" status)" = on
          bash "$SW" off
          test "$(bash "$SW" status)" = off
          ! curl -fs --max-time 3 http://127.0.0.1:8765/api/whoami
          echo "INTERRUPTEUR OK"
