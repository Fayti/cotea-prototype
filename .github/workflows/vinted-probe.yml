name: VintedBot sonde

on:
  push:
    branches: [claude/busy-archimedes-xdeifv]
    paths: ["vinted-bot/scripts/discover_item.py", ".github/workflows/vinted-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: vinted-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/discover_item.py
